name: Build and publish extension release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的纯 SemVer 版本号，例如 0.2.0（仅允许从 main 最新提交发布）"
        required: true
        type: string

permissions:
  contents: write

# 同一版本串行执行，且不取消进行中的发布
concurrency:
  group: extension-release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      ZIP_PATH: release/chrome-side-tabs-v${{ github.event_name == 'push' && github.ref_name || inputs.version }}.zip
      NOTES_PATH: release-notes.md
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 不要传 version 输入，版本由 package.json 的 packageManager 字段决定
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify release commit belongs to main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${GITHUB_SHA}" != "$(git rev-parse origin/main)" ]; then
            echo "手动发布只能从 main 的最新提交执行"
            exit 1
          fi

      - name: Validate release metadata
        run: node scripts/validate-release.js "$VERSION" --notes="$NOTES_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Build extension ZIP
        run: pnpm build:zip

      - name: Validate built release
        run: node scripts/validate-release.js "$VERSION" --dist --notes="$NOTES_PATH"

      - name: Generate SHA-256 checksum
        run: |
          cd release
          sha256sum "$(basename "$ZIP_PATH")" > "$(basename "$ZIP_PATH").sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$VERSION"
          elif [ "$(git rev-list -n 1 "$VERSION")" != "$GITHUB_SHA" ]; then
            echo "标签 $VERSION 已存在，但不指向当前发布提交"
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --title "Sift $VERSION" \
              --notes-file "$NOTES_PATH" \
              --latest
          else
            gh release create "$VERSION" \
              --verify-tag \
              --title "Sift $VERSION" \
              --notes-file "$NOTES_PATH" \
              --latest
          fi
          gh release upload "$VERSION" \
            "$ZIP_PATH" \
            "$ZIP_PATH.sha256" \
            --clobber
